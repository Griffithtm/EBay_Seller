name: CloneEbay CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - role_6
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ==========================================
  # Job 1: CI - Build & Run Unit Tests
  # ==========================================
  build-and-test:
    name: Build Solution & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore CloneEbay_Seller.sln

      - name: Build Solution
        run: dotnet build CloneEbay_Seller.sln --configuration Release --no-restore

      - name: Run xUnit Tests
        run: dotnet test CloneEbay_Seller.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: '**/TestResults/*.trx'

  # ==========================================
  # Job 2: CD - Build Docker Images
  # ==========================================
  docker-build:
    name: Build & Package Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./CloneEbay.API/Dockerfile
          push: false
          tags: cloneebay-api:latest

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./CloneEbay.Web/Dockerfile
          push: false
          tags: cloneebay-web:latest