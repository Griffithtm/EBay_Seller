events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Empty keys are not counted, so only POST /api/products enters this zone.
    map $request_method $product_create_key {
        default "";
        POST $binary_remote_addr;
    }

    limit_req_zone $product_create_key zone=product_create:10m rate=5r/m;

    upstream cloneebay_api {
        server api:8080;
        keepalive 16;
    }

    upstream cloneebay_web {
        server web:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 45m;

        location = /api/products {
            limit_req zone=product_create burst=3 nodelay;
            limit_req_status 429;
            error_page 429 = @product_rate_limited;
            proxy_pass http://cloneebay_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/ {
            proxy_pass http://cloneebay_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /health {
            proxy_pass http://cloneebay_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://cloneebay_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location / {
            proxy_pass http://cloneebay_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location @product_rate_limited {
            default_type application/json;
            add_header Retry-After "60" always;
            return 429 '{"success":false,"data":null,"error":{"code":"PRODUCT_CREATE_RATE_LIMITED","message":"Quá nhiều yêu cầu tạo sản phẩm. Vui lòng thử lại sau."},"meta":null}';
        }
    }
}
