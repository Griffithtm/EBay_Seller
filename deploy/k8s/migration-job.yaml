apiVersion: batch/v1
kind: Job
metadata:
  name: cloneebay-database-migration
  namespace: cloneebay
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: cloneebay-database-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: cloneebay-api:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["--migrate-only"]
          envFrom:
            - configMapRef:
                name: cloneebay-config
            - secretRef:
                name: cloneebay-secrets
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
