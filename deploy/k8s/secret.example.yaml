apiVersion: v1
kind: Secret
metadata:
  name: cloneebay-secrets
  namespace: cloneebay
type: Opaque
stringData:
  # Replace the placeholders locally. Never commit the real values.
  ConnectionStrings__DefaultConnection: "Server=SQL_SERVER_HOST;Database=CloneEbayDB;User Id=SQL_USER;Password=SQL_PASSWORD;TrustServerCertificate=True;Encrypt=True"
  Jwt__Key: "REPLACE_WITH_A_RANDOM_SECRET_OF_AT_LEAST_32_CHARACTERS"
  Seed__AdminPassword: "REPLACE_WITH_A_STRONG_LOCAL_ADMIN_PASSWORD"
  RedisPassword: "REPLACE_WITH_A_STRONG_REDIS_PASSWORD"
  Redis__ConnectionString: "cloneebay-redis:6379,password=REPLACE_WITH_A_STRONG_REDIS_PASSWORD,abortConnect=false"
