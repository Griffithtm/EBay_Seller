apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloneebay-web
  namespace: cloneebay
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloneebay-web
  template:
    metadata:
      labels:
        app: cloneebay-web
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          image: cloneebay-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cloneebay-config
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: data-protection-keys
              mountPath: /var/cloneebay/keys
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            failureThreshold: 20
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: data-protection-keys
          persistentVolumeClaim:
            claimName: cloneebay-web-keys
---
apiVersion: v1
kind: Service
metadata:
  name: cloneebay-web
  namespace: cloneebay
spec:
  selector:
    app: cloneebay-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloneebay-web-keys
  namespace: cloneebay
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
