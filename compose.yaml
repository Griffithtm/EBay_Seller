name: cloneebay-seller

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: CloneEbay.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=CloneEbayDB;User Id=sa;Password=${SQLSERVER_PASSWORD};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=False
      Jwt__Issuer: CloneEbay.API
      Jwt__Audience: CloneEbay.Client
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Database__ApplyMigrationsAtStartup: "true"
      Seed__AdminEmail: admin@cloneebay.local
      Seed__AdminUsername: Administrator
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Seed__DemoSellersEnabled: "true"
      Seed__DemoSellerPassword: ${DEMO_SELLER_PASSWORD:?Set DEMO_SELLER_PASSWORD in .env}
      DataProtection__KeysPath: /var/cloneebay/keys
      Redis__Enabled: "true"
      Redis__ConnectionString: redis:6379,abortConnect=false
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "7000:8080"
    volumes:
      - store-uploads:/app/wwwroot/uploads
      - api-data-protection:/var/cloneebay/keys

  web:
    build:
      context: .
      dockerfile: CloneEbay.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseUrl: http://api:8080/
      Api__PublicBaseUrl: http://localhost:8080
      DataProtection__KeysPath: /var/cloneebay/keys
    depends_on:
      api:
        condition: service_started
    ports:
      - "7248:8080"
    volumes:
      - web-data-protection:/var/cloneebay/keys

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  sqlserver-data:
  redis-data:
  store-uploads:
  api-data-protection:
  web-data-protection:
